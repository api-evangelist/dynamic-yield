name: Dynamic Yield
description: 'Dynamic Yield (a Mastercard company) is an experience optimization and
  personalization platform — branded "Experience OS" — used by retail, eCommerce, media,
  travel, and financial-services brands to individualize content, product recommendations,
  offers, search, and messaging across web, mobile app, email, and kiosk channels.
  The platform is MACH Alliance certified (microservices-based, API-first, cloud-native,
  headless) and exposes server-side Experience APIs (choose/collect for personalization
  and event tracking), a Product Feed / catalog API, a User Event API, Recommendation
  APIs, a Search API (query, pagination, filtering, sorting, autosuggest), and the
  Shopping Muse AI shopping-assistant API, alongside client-side script snippets and
  native mobile SDKs for iOS (Swift), Android (Kotlin), and React Native. Developer
  documentation, API reference, and a quarterly technical changelog are published at
  dy.dev. This profile was surfaced as a Bessemer Venture Partners portfolio company
  and enriched by the API Evangelist pipeline.'
