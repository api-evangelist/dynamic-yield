    EngagementsEcom:
      description: Report the [type of engagement](https://dy.dev/docs/engagement#types-of-engagement) with a reference to the content or recommendation that the user engaged with.
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/EngagementEcomClickImp'
        - $ref: '#/components/schemas/EngagementEcomSlotClick'
        - $ref: '#/components/schemas/EngagementEcomPnClick'
    EngagementsQsr:
      description: Report the [type of engagement](https://dy.dev/docs/engagement#types-of-engagement) with a reference to the content or recommendation that the user engaged with.
      type: array
      items:
        oneOf:
        - title: 'Engagement (type: SLOT_CLICK)'
          type: object
          properties:
            type:
              description: Pass `SLOT_CLICK`.
              type: string
              enum:
              - SLOT_CLICK
            slotId:
              description: Use to report a click on an API recommendation. Pass the Slot ID for the clicked product as returned in the `/choose` response.
              type: string
          required:
          - type
          - slotId
        - title: 'Engagement (type: SLOT_IMP)'
          type: object
          properties:
            type:
              description: Pass `SLOT_IMP`.
              type: string
              enum:
              - SLOT_IMP
            slotIds:
              description: Use to report impressions of an API recommendation. Pass the Slot IDs for the products as returned in the `/choose` response.
              type: array
              items:
                type: string
        - title: 'Engagement (type: IMP)'
          type: object
          properties:
            type:
              description: Pass the value `IMP` (impressions) for API custom code campaigns.
              type: string
              enum:
              - IMP
            decisionId:
              description: '**Required for reporting `IMP`:** The unique Decision ID as returned from the `/choose` endpoint.'
              type: string
            variations:
              $ref: '#/components/schemas/Variations'
          required:
          - type
          - decisionId
    EngagementEcomClickImp:
      title: 'Engagement (type: IMP, CLICK)'
