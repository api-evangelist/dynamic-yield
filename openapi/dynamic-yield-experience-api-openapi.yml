openapi: 3.0.3
info:
  version: '2.2'
  title: Dynamic Yield Experience API
  description: API definitions for all Dynamic Yield public endpoints.
  contact:
    name: API Support
    email: apisupport@mastercard.com
    url: https://developer.mastercard.com/support
servers:
- url: https://dy-api.com/v2
  description: US data center
- url: https://direct.dy-api.com/v2
  description: US data center, direct endpoint
- url: https://dy-api.eu/v2
  description: EU data center
- url: https://direct.dy-api.eu/v2
  description: EU data center, direct endpoint
security:
- ApiKeyAuth: []
paths:
  /collect/user/engagement:
    summary: Track Engagement
    post:
      summary: Track Engagement
      description: Report user engagement (clicks) with a variation or a recommended item.<br>If you are not sure which server URL you should use, [see here](https://dy.dev/docs/experience-api-basics).
      operationId: trackEngagement
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/EngagementBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '204':
          description: Engagements reported successfully.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /collect/user/event:
    summary: Track Events
    post:
      summary: Track Events
      description: Report a predefined or custom event.<br>If you are not sure which server URL you should use, [see here](https://dy.dev/docs/experience-api-basics).
      operationId: trackEvents
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/EventBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '204':
          description: Events reported successfully.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /collect/user/pageview:
    summary: Track Pageviews
    post:
      summary: Track Pageviews
      description: Report a pageview without choosing variations for any campaigns.<br>This endpoint has the same effect as calling `choose` with an empty `selector` argument.<br>If you are not sure which server URL you should use, [see here](https://dy.dev/docs/experience-api-basics).
      operationId: trackPageviews
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/PageviewBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '204':
          description: Pageviews reported successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /feeds/add-ons:
    summary: Update Add-Ons Feed
    post:
      summary: Update Add-Ons Feed
      description: Update the product add-ons for a global product feed.<br>**NOTE:** This endpoint accepts data in both JSON and CSV formats. Adjust the value for the `Content-Type` HTTP header as necessary (`application/json` vs. `text/csv`).<br>**USE ONLY FOR RESTAURANT SECTIONS**
      operationId: updateAddOnsFeed
      tags:
      - Product Data
      parameters:
      - $ref: '#/components/parameters/DySectionId'
      requestBody:
        $ref: '#/components/requestBodies/AddOnsFeedBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Invalid'
  /feeds/branch/outage/bulk:
    summary: Report Outages
    post:
      summary: Report Outages
      description: Report an outage of products in one or more stores.<br>**USE ONLY FOR RESTAURANT SECTIONS**
      operationId: reportOutages
      tags:
      - Product Data
      requestBody:
        $ref: '#/components/requestBodies/OutageBody'
      responses:
        '204':
          $ref: '#/components/responses/Success'
  /feeds/branch/{id}/inventory:
    summary: Update Branch Product Feed
    post:
      summary: Update Branch Product Feed
      description: Update the branch level feed state.<br>**USE ONLY FOR RESTAURANT SECTIONS**
      operationId: updateBranchFeed
      tags:
      - Product Data
      parameters:
      - $ref: '#/components/parameters/BranchFeedId'
      requestBody:
        $ref: '#/components/requestBodies/BranchFeedBody'
      responses:
        '204':
          description: Branch feed uploaded successfully.
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFoundBranchFeed'
        '422':
          $ref: '#/components/responses/InvalidBranchFeed'
  /feeds/{feedId}/bulk:
    summary: Update Product Feed
    post:
      summary: Update Product Feed
      description: Usually, a product feed is updated periodically. However, if you have a large number of products in your feed, updates can take some time. To avoid this, you can use an API to update only the changes in your feed (remove or add specific items, change item properties, and so on), and make changes to the feed more quickly.<br>**Support site article:** [Creating and Syncing a Product Feed Using APIs](https://support.dynamicyield.com/hc/en-us/articles/360038581394-Product-Feeds)
      operationId: updateProductFeed
      tags:
      - Product Data
      parameters:
      - $ref: '#/components/parameters/ProductFeedId'
      requestBody:
        $ref: '#/components/requestBodies/ProductFeedBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessProductFeed'
  /feeds/{feedId}/transaction/{transactionId}:
    summary: Track Transaction Status - Whole Transaction
    get:
      summary: Track Transaction Status - Whole Transaction
      description: Use this API to receive the status of an API call.<br>**Support site article:** [Creating and Syncing a Product Feed Using APIs](https://support.dynamicyield.com/hc/en-us/articles/360038581394-Product-Feeds)
      operationId: trackTransactionStatusWholeTransaction
      tags:
      - Product Data
      parameters:
      - $ref: '#/components/parameters/ProductFeedId'
      - $ref: '#/components/parameters/ProductFeedTransactionId'
      responses:
        '200':
          $ref: '#/components/responses/ResultTransactionStatus'
  /feeds/{feedId}/transaction/{transactionId}/item/{itemId}:
    summary: Track Transaction Status - Specific Item
    get:
      summary: Track Transaction Status - Specific Item
      description: Use this API to receive the status of an API call.<br>**Support site article:** [Creating and Syncing a Product Feed Using APIs](https://support.dynamicyield.com/hc/en-us/articles/360038581394-Product-Feeds)
      operationId: trackTransactionStatusSpecificItem
      tags:
      - Product Data
      parameters:
      - $ref: '#/components/parameters/ProductFeedId'
      - $ref: '#/components/parameters/ProductFeedTransactionId'
      - $ref: '#/components/parameters/ProductFeedItemId'
      responses:
        '200':
          $ref: '#/components/responses/ResultTransactionStatusSpecificItem'
  /serve/user/agent:
    summary: Shopping Muse
    post:
      summary: Shopping Muse
      description: Get response variations for Shopping Muse campaigns.
      operationId: shoppingMuse
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/ShoppingMuseBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessShoppingMuse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/browse:
    summary: Browse
    post:
      summary: Browse
      description: Get variations for category pages.
      operationId: browse
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/BrowseBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessSearch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/choose:
    summary: Choose Variations
    post:
      summary: Choose Variations
      description: Get the chosen variations for one or more campaigns.<br>If you are not sure which server URL you should use, [see here](https://dy.dev/docs/experience-api-basics).
      operationId: chooseVariations
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/ChooseBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessChoose'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/search:
    summary: Search
    post:
      summary: Search
      description: Get search variations for Semantic Search and Visual Search campaigns.
      operationId: search
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessSearch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/suggest:
    summary: Suggest
    post:
      summary: Suggest
      description: Get autosuggest variations.
      operationId: suggest
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/SuggestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessSuggest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /userdata/channels/{channel}/opt-in:
    summary: Update Reconnect Opt-In
    post:
      summary: Update Reconnect Opt-In
      description: Update a user's opt-in status to a specific channel in real time.
      operationId: updateReconnectOptIn
      tags:
      - User Data API
      parameters:
      - $ref: '#/components/parameters/UserDataChannel'
      requestBody:
        $ref: '#/components/requestBodies/UpdateReconnectOptInBody'
      responses:
        '202':
          $ref: '#/components/responses/SuccessUserData'
        '400':
          $ref: '#/components/responses/InvalidUserData'
  /userdata/channels/{channel}/opt-out:
    summary: Update Reconnect Opt-Out
    post:
      summary: Update Reconnect Opt-Out
      description: Update a user's opt-out status to a specific channel in real time.
      operationId: updateReconnectOptOut
      tags:
      - User Data API
      parameters:
      - $ref: '#/components/parameters/UserDataChannel'
      requestBody:
        $ref: '#/components/requestBodies/UpdateReconnectOptInBody'
      responses:
        '202':
          $ref: '#/components/responses/SuccessUserData'
        '400':
          $ref: '#/components/responses/InvalidUserData'
  /userdata/events:
    summary: External Events
    post:
      summary: External Events
      description: Track user interaction event using the user's `cuid`. Use in cases where the user's `dyid` is unavailable (e.g. offline activity).
      operationId: externalEvents
      tags:
      - User Data API
      requestBody:
        $ref: '#/components/requestBodies/ExternalEventsBody'
      responses:
        '202':
          $ref: '#/components/responses/SuccessUserData'
        '400':
          $ref: '#/components/responses/InvalidUserData'
  /userdata/{feedKey}/bulk:
    summary: User Data API
    post:
      summary: User Data API
      description: The User Data API enables you to update your user data on demand, including partial updates.<br>**Support site article:** [User Data Feed](https://support.dynamicyield.com/hc/en-us/articles/4409595248017-Update-Your-User-Data-Feed-by-API-?_ga=2.258389066.1730957539.1709454788-192163951.1671449880#update-your-user-data-feed-by-api-0-0)
      operationId: userDataApi
      tags:
      - User Data API
      parameters:
      - $ref: '#/components/parameters/UserDataFeedKey'
      requestBody:
        $ref: '#/components/requestBodies/UserDataBody'
      responses:
        '202':
          $ref: '#/components/responses/SuccessUserData'
        '400':
          $ref: '#/components/responses/InvalidUserData'
  /userprofile:
    summary: Profile Anywhere
    get:
      summary: Profile Anywhere
      description: Retrieve user affinity data generated by Dynamic Yield, enabling you to offer enhanced personalized experiences to your customers across all your touchpoints, both online and offline.<br>**Note:** Rate limit is 50 calls per second.<br>**Support site article:** [Profile Anywhere](https://support.dynamicyield.com/hc/en-us/articles/8126598211229-Profile-Anywhere?_ga=2.9198581.1730957539.1709454788-192163951.1671449880)
      operationId: profileAnywhere
      tags:
      - Profile Anywhere
      parameters:
      - $ref: '#/components/parameters/UserProfileCuid'
      - $ref: '#/components/parameters/UserProfileCuidType'
      - $ref: '#/components/parameters/UserProfileAffinity'
      responses:
        '200':
          $ref: '#/components/responses/ResultUserProfile'
components:
  schemas:
    BrowsePayloadEcom:
      title: Implement Category Pages on Your Website
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ChooseUserEcom'
        session:
          $ref: '#/components/schemas/SessionChoose'
        query:
          $ref: '#/components/schemas/QueryBrowse'
        context:
          $ref: '#/components/schemas/ContextSearchEcom'
        options:
          $ref: '#/components/schemas/OptionsBrowse'
      required:
      - user
      - session
      - query
      - context
    QueryResults:
      title: Query Results
      type: object
      properties:
        choices:
          description: The chosen variation for each campaign.
          type: array
          items:
            oneOf:
            - title: 'type: "SEMANTIC_SEARCH_DECISION"'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  default: Semantic Search
                  pattern: Semantic Search
                type:
                  type: string
                  default: SEMANTIC_SEARCH_DECISION
                  pattern: SEMANTIC_SEARCH_DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: The ID of the returned variation item.
                        type: number
                        example: 27883308
                      payload:
                        type: object
                        properties:
                          type:
                            description: The payload type returned for this variation.
                            type: string
                            default: SEARCH
                            pattern: SEARCH
                            example: SEARCH
                          data:
                            type: object
                            properties:
                              totalNumResults:
                                description: The total number of items that match the query.
                                type: number
                                example: 125
                              facets:
                                description: Facet groups returned for filtering the result set.
                                type: array
                                items:
                                  oneOf:
                                  - title: 'valuesType: "string"'
                                    type: object
                                    properties:
                                      column:
                                        type: string
                                      valuesType:
                                        type: string
                                        enum:
                                        - string
                                      displayName:
                                        type: string
                                      values:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                            count:
                                              type: number
                                  - title: 'valuesType: "number"'
                                    type: object
                                    properties:
                                      column:
                                        type: string
                                      valuesType:
                                        type: string
                                        enum:
                                        - number
                                      displayName:
                                        type: string
                                      min:
                                        type: number
                                      max:
                                        type: number
                              slots:
                                description: The list of product slots returned in the search response.
                                type: array
                                items:
                                  type: object
                                  properties:
                                    slotId:
                                      type: string
                                    sku:
                                      type: string
                              searchQuery:
                                description: The search query as sent in the request
                                type: string
                                example: running shoes
                              normalizedQuery:
                                description: The search query as sent in the request after trimming whitespaces and removing special characters - [%/\\|;:<>]
                                type: string
                                example: running shoes
                              spellCheckedQuery:
                                description: The search query after normalization and typos correction. Only returned for requests with enableSpellCheck = true
                                type: string
                                example: running shoes
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            description: The ID of the campaign that produced the variation.
                            type: number
                            example: 771007
                          campaignName:
                            description: The name of the campaign that produced the variation.
                            type: string
                            example: Semantic Search
                          experienceId:
                            description: The ID of the experience containing the variation.
                            type: number
                            example: 27883307
                          experienceName:
                            description: The name of the experience.
                            type: string
                            example: PLP Experience
                          variationId:
                            description: The ID of the selected variation.
                            type: number
                            example: 27883308
                          variationName:
                            description: The selected variation's name.
                            type: string
                            example: Variation 1
                decisionId:
                  type: string
            - title: 'type: "VISUAL_SEARCH_DECISION"'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  default: Visual Search
                  pattern: Visual Search
                type:
                  type: string
                  default: VISUAL_SEARCH_DECISION
                  pattern: VISUAL_SEARCH_DECISION
                variations:
                  type: array
                  items:
                    $ref: '#/components/schemas/QueryResults/properties/choices/items/oneOf/0/properties/variations/items'
                decisionId:
                  type: string
        cookies:
          description: Cookies returned from the server.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
              maxAge:
                type: string
        warnings:
          description: Errors returned by the server.
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
    Error:
      description: Response object for an invalid request.
      type: object
      properties:
        message:
          $ref: '#/components/schemas/ErrorMessage'
        type:
          $ref: '#/components/schemas/ErrorType'
    ErrorMessage:
      description: Error description.
      type: string
      example: request must contain context page location
    ErrorType:
      description: The type of error encountered.
      type: string
      example: badRequest
    ChooseUserEcom:
      title: User
      description: User ID. A Dynamic Yield-generated identifier is used, and managed via cookies. For a new user, send this object empty.
      type: object
      properties:
        dyid:
          $ref: '#/components/schemas/Dyid'
        dyid_server:
          $ref: '#/components/schemas/Dyid'
        active_consent_accepted:
          $ref: '#/components/schemas/ActiveConsentAccepted'
    Dyid:
      description: The _dyid cookie value. The user ID assigned to visitors by Dynamic Yield. For a new user, send this param empty. Learn more about the [user ID](https://dy.dev/docs/experience-api-basics#user-id).
      type: string
    ActiveConsentAccepted:
      description: Add this attribute only if [active cookie consent](https://dy.dev/docs/active-cookie-consent) is enabled. Set to `true` if user gave consent for cookies.
      type: boolean
      default: false
    SessionChoose:
      title: Session
      description: Session ID. A Dynamic Yield-generated identifier is used. For new sessions, send this object empty.
      type: object
      properties:
        dy:
          description: Pass the value of the `_dyjsession` cookie if it exists. Otherwise, a new session identifier will be created by Dynamic Yield and returned in the response.
          type: string
          example: ohyr6v42l9zd4bpinnvp7urjjx9lrssw
    ContextSearchEcom:
      title: Context
      description: The request's context.
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        device:
          $ref: '#/components/schemas/DeviceChooseEcom'
        channel:
          $ref: '#/components/schemas/ChannelEcom'
        pageAttributes:
          $ref: '#/components/schemas/PageAttributes'
        branch:
          $ref: '#/components/schemas/BranchEcom'
      required:
      - page
      - device
    Page:
      description: Data for the page currently being browsed.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PageType'
        data:
          $ref: '#/components/schemas/PageData'
        location:
          $ref: '#/components/schemas/Location'
        referrer:
          $ref: '#/components/schemas/Referrer'
        locale:
          $ref: '#/components/schemas/Locale'
      required:
      - type
      - location
    PageType:
      description: Page type. Must be upper case. Valid values are:<br>`HOMEPAGE`, `CATEGORY`, `PRODUCT`, `CART`, and `OTHER`.
      type: string
      enum:
      - HOMEPAGE
      - CATEGORY
      - PRODUCT
      - CART
      - OTHER
      example: HOMEPAGE
    PageData:
      description: 'Additional data for non-homepage pages: The SKU for a `PRODUCT` page, the category for a `CATEGORY` page, SKUs for the `CART` page, and the page ID in `OTHER`. Learn more about [page context data](https://dy.dev/docs/page-context#localization-in-page-context).'
      type: array
      items:
        type: string
      example:
      - p76311-020
    Location:
      description: The current location. URL (for web), location (for SPA), or screen name (for mobile apps). Enables targeting the current page/screen.
      type: string
      example: https://shop.biz/nice-shirt-p76311.html
    Referrer:
      description: The previous location. URL (for web), location (for SPA), or screen name (for mobile apps). Enables targeting the previous page or screen. For web implementations, can be used for traffic source targeting, including search, social, and referral traffic classification. Pass the full referrer URL (include HTTP:// or HTTPS://) not only the referring domain.
      type: string
      example: https://google.cz
    Locale:
      description: Page locale code, such as `en_US`. Learn more about [using country codes for locale](https://dy.dev/docs/page-context#localization-in-page-context).
      type: string
      example: en_US
    DeviceChooseEcom:
      description: Data for the served device.
      type: object
      properties:
        userAgent:
          $ref: '#/components/schemas/UserAgent'
        type:
          $ref: '#/components/schemas/DeviceTypeEcom'
        browser:
          $ref: '#/components/schemas/Browser'
        ip:
          $ref: '#/components/schemas/Ip'
        dateTime:
          $ref: '#/components/schemas/DateTime'
    UserAgent:
      description: 'For web clients, the browser user-agent string. If not passed, the API gateway checks for the header in the HTTPS request. This applies only to client-side API calls when isImplicitClientData: true is set in the Options object.'
      type: string
      example: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36
    DeviceTypeEcom:
      description: Use when the user agent isn't available. Valid values are:<br>`DESKTOP`, `SMARTPHONE`, `TABLET`, `KIOSK`
      type: string
      enum:
      - DESKTOP
      - SMARTPHONE
      - TABLET
      - KIOSK
    Browser:
      description: Use when the user agent isn't available. Valid values are:<br>`Chrome`, `Firefox`, `Opera`, `Safari`, `Other`
      type: string
      enum:
      - Chrome
      - Firefox
      - Opera
      - Safari
      - Other
      example: Firefox
    Ip:
      description: 'The client IP address, for geolocation-based targeting and audience building. If not passed, the caller IP is used. This applies only to client-side API calls when isImplicitClientData: true is set in the Options object.'
      type: string
      example: 54.100.200.255
    DateTime:
      description: 'Date & time in ISO 8601 format: YYYY-MM-DDThh:mm:ss.sss±hh:mm (with local time zone).'
      type: string
      example: '2024-01-01T22:30:00.000-05:00'
    ChannelEcom:
      description: Report and monitor each channel’s Experience API implementation. The channel corresponds to the Experience OS app used (`WEB` or `APP`), and the values are available for filtering in the API logs.
      type: string
      enum:
      - WEB
      - APP
    BranchEcom:
      description: The branch where the user experience is taking place.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BranchIdEcom'
      required:
      - id
    BranchIdEcom:
      description: The branch's unique identifier.
      type: string
    PageAttributes:
      description: Pass key-value pairs you want to use for targeting in this campaign. **The value must exactly match the value in the campaign targeting condition, and is case sensitive.** This data is not stored and cannot be used for creating audiences. Values can be strings or numbers.
      type: object
      additionalProperties:
        anyOf:
        - type: string
        - type: number
    OptionsBrowse:
      title: Options
      description: Request configuration parameters.
      type: object
      properties:
        returnAnalyticsMetadata:
          $ref: '#/components/schemas/ReturnAnalyticsMetadata'
        isImplicitClientData:
          $ref: '#/components/schemas/IsImplicitClientData'
        productData:
          $ref: '#/components/schemas/ProductDataEcom'
    ReturnAnalyticsMetadata:
      description: Set to `true` to return additional metadata (display names & IDs for all entities) for reporting to analytics tools.
      type: boolean
      default: false
    IsImplicitClientData:
      description: For APIs called from the client-side only. When set to `true`, this acts as a fallback if the IP address or user agent isn't sent explicitly. Takes the values from the request header.
      type: boolean
      default: false
    ProductDataEcom:
      description: You can use *either* the `fieldFilter` param to ask for specific attributes from the feed, *or* the `skusOnly` param to to fetch only the SKUs.
      type: object
      properties:
        fieldFilter:
          $ref: '#/components/schemas/FieldFilter'
        skusOnly:
          $ref: '#/components/schemas/SkusOnly'
    FieldFilter:
      description: Specify the fields you need in the recommendation campaign response by using the `fieldFilter` parameter. Simply send an array of strings of the relevant fields, and only those fields and values are sent back.
      type: array
      items:
        type: string
    SkusOnly:
      description: To reduce the size of the response, you can limit it so that it only includes the SKUs.
      type: boolean
    QueryBrowse:
      title: Query
      description: The user query for which to conduct the browse request.
      type: object
      properties:
        displayName:
          type: string
        filters:
          $ref: '#/components/schemas/QueryFilters'
        pagination:
          $ref: '#/components/schemas/QueryPagination'
        sortBy:
          $ref: '#/components/schemas/QuerySortBy'
      required:
      - pagination
    QueryFilters:
      description: Parameters to filter the search results. When multiple filters are applied, only records matching all specified criteria (`AND` logic) are returned.
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/QueryFilterNumber'
        - $ref: '#/components/schemas/QueryFilterString'
    QueryFilterNumber:
      title: Numeric Filter
      type: object
      properties:
        field:
          description: Column name, as reported in the product feed.
          type: string
          example: price
        min:
          description: Minimum numeric or date value for a product feed attribute, such as `price`.
          type: number
          example: 10
        max:
          description: Maximum numeric or date value for a product feed attribute, such as `price`.
          type: number
          example: 100
      required:
      - field
    QueryFilterString:
      title: String Filter
      type: object
      properties:
        field:
          description: Column name, as reported in the product feed.
          type: string
          example: color
        values:
          description: Possible values for the filter column. When multiple values are specified, results matching any of the values (`OR` logic) will be returned.
          type: array
          items:
            type: string
      required:
      - field
    QueryPagination:
      description: Pagination parameters for the query result.
      type: object
      properties:
        numItems:
          description: The number of items to be returned in the query result. The maximum is 500 items.
          type: number
          example: 24
        offset:
          description: The starting offset.
          type: number
          example: 0
      required:
      - numItems
      - offset
    QuerySortBy:
      description: Whether to sort the query results. Leave this field empty to sort results by relevance.
      type: object
      properties:
        field:
          description: Must be a column name from your product feed. Case sensitive. Results will by sorted by column type:<ul><li>**Strings:** alphabetically.</li><li>**Numbers:** by size.</li><li>**Dates:** by recency.</li></ul>To sort by product popularity, use `popularity` instead of a column name.
          type: string
          example: popularity
        order:
          description: The sort order (ascending or descending).
          type: string
          example: asc
          enum:
          - asc
          - desc
      required:
      - field
      - order
    ChoosePayloadEcom:
      title: Choose Request - E-Commerce
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ChooseUserEcom'
        session:
          $ref: '#/components/schemas/SessionChoose'
        context:
          $ref: '#/components/schemas/ContextChooseEcom'
        selector:
          $ref: '#/components/schemas/SelectorChoose'
        options:
          $ref: '#/components/schemas/OptionsChooseEcom'
      required:
      - user
      - session
      - context
      - selector
    ChoosePayloadFi:
      allOf:
      - title: Choose Request - Financial Institutions
      - $ref: '#/components/schemas/ChoosePayloadEcom'
    ChoosePayloadQsr:
      title: Choose Request - Restaurants
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ChooseUserQsr'
        session:
          $ref: '#/components/schemas/SessionChoose'
        context:
          $ref: '#/components/schemas/ContextChooseQsr'
        selector:
          description: Campaigns to choose variations for, formatted as `widgetIdentifier@campaignIdentifier`.
          type: object
          properties:
            names:
              $ref: '#/components/schemas/Names'
            groups:
              $ref: '#/components/schemas/Groups'
            preview:
              $ref: '#/components/schemas/Preview'
          required:
          - names
        options:
          $ref: '#/components/schemas/OptionsChooseQsr'
      required:
      - user
      - session
      - context
      - selector
    Choice:
      title: Choice
      type: object
      properties:
        choices:
          description: The chosen variation for each campaign.
          type: array
          items:
            oneOf:
            - title: 'type: DECISION'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: DECISION
                  pattern: DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            default: CUSTOM_JSON
                            pattern: CUSTOM_JSON
                          data:
                            type: object
                      rolloutFlag:
                        type: boolean
                        description: Only in Rollout campaigns
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            type: number
                          campaignName:
                            type: string
                          experienceId:
                            type: number
                          experienceName:
                            type: string
                          variationId:
                            type: number
                          variationName:
                            type: string
                groups:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
                allocationGroup:
                  type: string
            - title: 'type: RECS_DECISION'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: RECS_DECISION
                  pattern: RECS_DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            default: RECS
                            pattern: RECS
                          data:
                            type: object
                            properties:
                              custom:
                                type: object
                              slots:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    sku:
                                      type: string
                                    slotId:
                                      type: string
                                    productData:
                                      type: object
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            type: number
                          campaignName:
                            type: string
                          experienceId:
                            type: number
                          experienceName:
                            type: string
                          variationId:
                            type: number
                          variationName:
                            type: string
                groups:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
                allocationGroup:
                  type: string
            - title: 'type: QSR_PRODUCT_RECS_DECISION'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: QSR_PRODUCT_RECS_DECISION
                  pattern: QSR_PRODUCT_RECS_DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            default: QSR_PRODUCT_RECS
                            pattern: QSR_PRODUCT_RECS
                          data:
                            type: object
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            type: number
                          campaignName:
                            type: string
                          experienceId:
                            type: number
                          experienceName:
                            type: string
                          variationId:
                            type: number
                          variationName:
                            type: string
                groups:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
                allocationGroup:
                  type: string
            - title: 'type: SORTING_DECISION'
              type: object
              properties:
                name:
                  type: string
                id:
                  type: number
                type:
                  type: string
                  default: SORTING_DECISION
                  pattern: SORTING_DECISION
                decisionId:
                  type: string
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      payload:
                        type: object
                        properties:
                          data:
                            type: object
                            properties:
                              slots:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    sku:
                                      type: string
                                    slotId:
                                      type: string
        cookies:
          description: Cookies returned from the server.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
              maxAge:
                type: string
        warnings:
          description: Errors returned by the server.
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
    ChooseUserQsr:
      oneOf:
      - $ref: '#/components/schemas/ChooseUserQsrSharedDeviceTrue'
      - $ref: '#/components/schemas/ChooseUserQsrSharedDeviceFalse'
    ChooseUserQsrSharedDeviceTrue:
      title: 'User (sharedDevice: true)'
      description: User ID. A Dynamic Yield-generated identifier is used, and managed via cookies. For a new user, send this object empty.
      type: object
      properties:
        sharedDevice:
          $ref: '#/components/schemas/SharedDeviceTrue'
        cuid:
          description: User identifier value. Required for identified user flows.
          type: string
          example: customer_12345
        cuidType:
          description: 'Use this identifier type to identify users across devices (for example, `customer_id`, `account_id`, or `he` for SHA-256 hashed email).<br>**Note: Do not include any personal information in this ID.**<br>Required for identified user flows.'
          type: string
          example: customer_id
      required:
      - sharedDevice
    ChooseUserQsrSharedDeviceFalse:
      allOf:
      - title: 'User (sharedDevice: false)'
      - $ref: '#/components/schemas/ChooseUserEcom'
      - properties:
          sharedDevice:
            $ref: '#/components/schemas/SharedDeviceFalse'
      required:
      - sharedDevice
    SharedDeviceTrue:
      description: Set to `true` for transactions done on a shared device in a branch (always `true` for kiosk and ODMB).
      type: boolean
      default: true
    SharedDeviceFalse:
      description: Set to `false` for transactions made on personal devices.
      type: boolean
      default: false
    ContextChooseEcom:
      title: Context
      description: The request's context.
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        device:
          $ref: '#/components/schemas/DeviceChooseEcom'
        channel:
          $ref: '#/components/schemas/ChannelEcom'
        pageAttributes:
          $ref: '#/components/schemas/PageAttributes'
        listedItems:
          $ref: '#/components/schemas/ListedItems'
        branch:
          $ref: '#/components/schemas/BranchEcom'
      required:
      - page
      - device
    ContextChooseQsr:
      title: Context
      description: The request's context.
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        device:
          $ref: '#/components/schemas/DeviceChooseQsr'
        branch:
          $ref: '#/components/schemas/BranchQsr'
        channel:
          $ref: '#/components/schemas/ChannelQsr'
        cart:
          $ref: '#/components/schemas/CartQsr'
        pageAttributes:
          $ref: '#/components/schemas/PageAttributes'
      required:
      - branch
      - channel
    DeviceChooseQsr:
      description: Data for the served device.
      type: object
      properties:
        userAgent:
          $ref: '#/components/schemas/UserAgent'
        type:
          $ref: '#/components/schemas/DeviceTypeQsr'
        browser:
          $ref: '#/components/schemas/Browser'
        ip:
          $ref: '#/components/schemas/Ip'
        dateTime:
          $ref: '#/components/schemas/DateTime'
        id:
          $ref: '#/components/schemas/DeviceIdQsr'
      required:
      - dateTime
      - type
    DeviceTypeQsr:
      description: Use when the user agent isn't available. Valid values are:<br>`DESKTOP`, `SMARTPHONE`, `TABLET`, `KIOSK`, `ODMB`
      type: string
      enum:
      - DESKTOP
      - SMARTPHONE
      - TABLET
      - KIOSK
      - ODMB
    DeviceIdQsr:
      description: The identifier of the device in the branch.
      type: string
    ChannelQsr:
      description: 'Report and monitor each channel''s experience API implementation. Channels correspond to the Experience OS app used. Available channels: `WEB`, `APP`, `KIOSK`, `DRIVE-THRU`'
      type: string
      enum:
      - WEB
      - APP
      - KIOSK
      - DRIVE-THRU
    BranchQsr:
      description: Use to recommend only items in stock at the branch the user is browsing.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BranchIdQsr'
        dayPart:
          $ref: '#/components/schemas/DayPart'
        orderFulfillment:
          $ref: '#/components/schemas/OrderFulfillment'
      required:
      - dayPart
    BranchIdQsr:
      description: The ID of the branch the recommendation is for.
      type: string
    DayPart:
      description: Define the period of the day the request ralates to. Possible values are those used in the Product Catalog.
      type: string
      enum:
      - BREAKFAST
      - LUNCH
      - DINNER
      - LATENIGHT
    OrderFulfillment:
      description: The fulfillment type of the order the request relates to.
      type: string
      enum:
      - DELIVERY
      - PICKUP
      - DINEIN
      - CURBSIDE
    ListedItems:
      description: List of SKUs to sort on PLP. Use only for Sorting Optimizer campaigns.
      type: array
      items:
        type: string
      example:
      - SKU1
      - SKU2
    SelectorChoose:
      title: Selector
      description: Campaigns to choose variations for.
      type: object
      properties:
        names:
          $ref: '#/components/schemas/Names'
        groups:
          $ref: '#/components/schemas/Groups'
        preview:
          $ref: '#/components/schemas/Preview'
        args:
          $ref: '#/components/schemas/Args'
      required:
      - names
    Groups:
      description: Call a group of selectors instead of listing each selector individually. Learn more about working with [selector groups](https://dy.dev/docs/selector-groups).
      type: array
      items:
        type: string
    Names:
      description: The list of selectors that are eligible for this page. A selector represents a technical name for a campaign. Learn more about [using selectors in your campaigns](https://dy.dev/docs/choose#recommended-use).
      type: array
      items:
        type: string
      example:
      - Banner Main
      - German Banner
      - PDP Recs Tray
    Preview:
      description: Campaigns to generate previews for. [Learn more about enabling preview mode](https://dy.dev/docs/preview-api-web#enabling-preview-mode).
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/Ids'
      required:
      - ids
    Ids:
      description: Array of preview tokens, as provided in the `dyApiPreview` URL parameter. [Learn more about enabling preview mode](https://dy.dev/docs/preview-api-web#enabling-preview-mode).
      type: array
      items:
        type: string
    Args:
      description: Real-time filters for recommendation results, based on data obtained within the session. Learn more about working with [real-time filters](https://dy.dev/docs/return-real-time-filter-data).
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ArgsItem'
    ArgsItem:
      description: Real-time filter for a single selector. The object key should corresponds to a selector name defined under `selector.names`.
      type: object
      properties:
        realtimeRules:
          $ref: '#/components/schemas/RealtimeRules'
    RealtimeRules:
      description: A list of realtime filtering rules.
      type: array
      items:
        type: object
        properties:
          type:
            $ref: '#/components/schemas/RealtimeRuleType'
          slots:
            $ref: '#/components/schemas/RealtimeRuleSlots'
          query:
            $ref: '#/components/schemas/RealtimeRuleQuery'
    RealtimeRuleType:
      description: 'Valid values are: `include`, `exclude`.'
      type: string
      enum:
      - include
      - exclude
    RealtimeRuleSlots:
      description: All or specific slot positions. The first slot is in position 0.
      type: array
      items:
        type: integer
    RealtimeRuleQuery:
      description: The filtering query.
      type: object
      properties:
        conditions:
          $ref: '#/components/schemas/QueryConditions'
    QueryConditions:
      description: The realtime rule's query conditions.
      type: array
      items:
        type: object
        properties:
          field:
            $ref: '#/components/schemas/QueryField'
          arguments:
            $ref: '#/components/schemas/QueryArguments'
        required:
        - field
        - arguments
    QueryField:
      description: Field within the returned results to apply the query for.
      type: string
      example: categories
    QueryArguments:
      description: A list of arguments for a query condition.
      type: array
      items:
        type: object
        properties:
          action:
            $ref: '#/components/schemas/QueryAction'
          value:
            $ref: '#/components/schemas/QueryValue'
        required:
        - action
        - value
    QueryAction:
      description: Condition types for filtering recommendations. Valid values are:<ul>`IS` - string or boolean<br>`IS_NOT` - string<br>`CONTAINS` - A filtering rule may contain up to 10 queries of this type<br>`EQ`, `GT`, `GTE`, `LT`, `LTE` - number only
      type: string
      enum:
      - IS
      - IS_NOT
      - CONTAINS
      - EQ
      - GT
      - GTE
      - LT
      - LTE
    QueryValue:
      description: Parameter for filter value by condition. Regular expressions are not supported for real-time filters (can and should be added as additional conditions to the filter).
      example: basketball
    OptionsChooseEcom:
      title: Options
      description: Request configuration parameters.
      type: object
      properties:
        isImplicitPageview:
          $ref: '#/components/schemas/IsImplicitPageview'
        returnAnalyticsMetadata:
          $ref: '#/components/schemas/ReturnAnalyticsMetadata'
        isImplicitImpressionMode:
          $ref: '#/components/schemas/IsImplicitImpressionMode'
        isImplicitClientData:
          $ref: '#/components/schemas/IsImplicitClientData'
        recsProductData:
          $ref: '#/components/schemas/RecsProductDataEcom'
        deduplicateRecommendations:
          $ref: '#/components/schemas/DeduplicateRecommendationsEcom'
    OptionsChooseQsr:
      title: Options
      description: Request configuration parameters.
      type: object
      properties:
        isImplicitPageview:
          description: Determine whether to report a new pageview with the given context. Default is `false`. Set to `true` to report a new pageview with the given context. Keep as `false` if the Dynamic Yield script is implemented on the page. It reports the new pageview from the browser. For API implementations on shared devices (e.g. Kiosk or Drive-Thru), pass as `true`.
          type: boolean
          default: false
          example: false
        returnAnalyticsMetadata:
          $ref: '#/components/schemas/ReturnAnalyticsMetadata'
        isImplicitImpressionMode:
          $ref: '#/components/schemas/IsImplicitImpressionModeQsr'
        isImplicitClientData:
          $ref: '#/components/schemas/IsImplicitClientData'
        recsProductData:
          $ref: '#/components/schemas/RecsProductDataQsr'
        deduplicateRecommendations:
          $ref: '#/components/schemas/DeduplicateRecommendationsQsr'
    IsImplicitPageview:
      description: Determine whether to report a new pageview with the given context. Default is `false`. Set to `true` to report a new pageview with the given context. Keep as `false` if the Dynamic Yield script is implemented on the page. It reports the new pageview from the browser.
      type: boolean
      default: false
    IsImplicitImpressionMode:
      description: Report an impression of the chosen variation. This is set to `true` by default, which means that the user's impression of the variation is reported immediately when the variation is chosen. Pass this as `false` to report the impression explicitly in an [Engagement](https://dy.dev/docs/engagement#types-of-engagement) call.
      type: boolean
      default: true
    IsImplicitImpressionModeQsr:
      description: Report an impression of the chosen variation. For Restaurants, this is set to `false` by default, which means that impressions should be reported explicitly in an [Engagement](https://dy.dev/docs/engagement#types-of-engagement) call. Pass this as `true` in case the user's impression of the variation should be reported immediately when the variation is chosen.
      type: boolean
      default: false
    DeduplicateRecommendationsEcom:
      description: Set to `true` to prevent duplicate products from appearing across recommendation results. Supported for requests with up to 10 selectors. If there are more than 10, the API skips deduplication and returns a warning in the response.
      type: boolean
      default: false
    DeduplicateRecommendationsQsr:
      description: Set to `true` to prevent duplicate products from appearing across recommendation results. Supported for requests with up to 10 selectors. If there are more than 10, the API skips deduplication and returns a warning in the response.
      type: boolean
      default: false
    RecsProductDataEcom:
      description: You can use *either* the `fieldFilter` param to ask for specific attributes from the feed, *or* the `skusOnly` param to to fetch only the SKUs.
      type: object
      properties:
        fieldFilter:
          $ref: '#/components/schemas/FieldFilter'
        skusOnly:
          $ref: '#/components/schemas/SkusOnly'
    RecsProductDataQsr:
      description: You can use *either* the `fieldFilter` param to ask for specific attributes from the feed, *or* the `skusOnly` param to to fetch only the SKUs.
      type: object
      properties:
        fieldFilter:
          $ref: '#/components/schemas/FieldFilter'
        skusOnly:
          $ref: '#/components/schemas/SkusOnly'
    CartQsr:
      description: Personalize campaigns based on cart state.<br>**Required when basket-based strategies and rules are being used.**
      type: array
      items:
        type: object
        properties:
          productId:
            $ref: '#/components/schemas/CartProductIdQsr'
          quantity:
            $ref: '#/components/schemas/CartQuantity'
          itemPrice:
            $ref: '#/components/schemas/CartItemPrice'
          innerProducts:
            $ref: '#/components/schemas/InnerProductsQsr'
        required:
        - productId
    CartProductIdQsr:
      description: The product ID from the restaurant product catalog.
      type: string
    CartQuantity:
      description: Number of items.
      type: number
    CartItemPrice:
      description: unit.cents format using the section default currency.
      type: number
      example: 23.99
    InnerProductsQsr:
      description: Indicate any inner products within the main product (for example, the individual products that make up a meal, or any extras/toppings). All inner products are listed at the same hierarchical level, even if they are a component of a component (say, extra cheese on a sandwich that is part of a meal).
      type: array
      items:
        type: object
        properties:
          productId:
            $ref: '#/components/schemas/CartProductIdQsr'
          quantity:
            $ref: '#/components/schemas/CartQuantity'
          itemPrice:
            $ref: '#/components/schemas/CartItemPrice'
        required:
        - productId
    SearchPayloadEcom:
      title: Search Request - E-Commerce
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ChooseUserEcom'
        session:
          $ref: '#/components/schemas/SessionChoose'
        query:
          oneOf:
          - $ref: '#/components/schemas/QuerySemanticSearch'
          - $ref: '#/components/schemas/QueryVisualSearch'
        context:
          $ref: '#/components/schemas/ContextSearchEcom'
        selector:
          $ref: '#/components/schemas/SelectorSearch'
        options:
          $ref: '#/components/schemas/OptionsSearchEcom'
      required:
      - user
      - session
      - query
      - context
      - selector
    SelectorSearch:
      title: Selector
      description: Campaigns to choose variations for.
      type: object
      properties:
        name:
          description: The selector name for the applicable search campaign. Must be one of the following:<ul><li>`Semantic Search`</li><li>`Visual Search`</li></ul>
          type: string
          example: Semantic Search
          enum:
          - Semantic Search
          - Visual Search
      required:
      - name
    OptionsSearchEcom:
      title: Options
      description: Request configuration parameters.
      type: object
      properties:
        returnAnalyticsMetadata:
          $ref: '#/components/schemas/ReturnAnalyticsMetadata'
        isImplicitClientData:
          $ref: '#/components/schemas/IsImplicitClientData'
        productData:
          $ref: '#/components/schemas/ProductDataEcom'
        isImplicitKeywordSearchEvent:
          $ref: '#/components/schemas/isImplicitKeywordSearchEvent'
    isImplicitKeywordSearchEvent:
      description: When set to `true`, a Keyword Search event is reported for the searched textual query.
      type: boolean
      default: false
    enableSpellCheck:
      description: Set to `true`, to enable typo corrections for the textual search query.
      type: boolean
      default: false
    QuerySemanticSearch:
      title: Semantic Search Query
      description: The user query for which to conduct the search.
      type: object
      properties:
        text:
          $ref: '#/components/schemas/QueryText'
        filters:
          $ref: '#/components/schemas/QueryFilters'
        pagination:
          $ref: '#/components/schemas/QueryPagination'
        sortBy:
          $ref: '#/components/schemas/QuerySortBy'
        enableSpellCheck:
          $ref: '#/components/schemas/enableSpellCheck'
      required:
      - text
      - pagination
    QueryVisualSearch:
      title: Visual Search Query
      description: The user query for which to conduct the search.
      type: object
      properties:
        imageBase64:
          $ref: '#/components/schemas/QueryImageBase64'
        filters:
