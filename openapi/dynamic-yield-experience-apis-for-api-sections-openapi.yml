components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: DY-API-Key
      x-default: your-api-key
tags:
- name: API only
  description: API-only mode endpoints, for users who want to use the Experience APIs without using the full Experience OS features. In API-only mode, you are responsible for generating user and session IDs, and for reporting pageviews and events, while still benefiting from Dynamic Yield's personalization capabilities.
