      - selector
      - commerce
    ContextPageviewEcom:
      title: Context
      description: The request's context.
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        device:
          $ref: '#/components/schemas/DevicePageviewEcom'
        channel:
          $ref: '#/components/schemas/ChannelEcom'
      required:
      - page
      - device
    SecondaryIdentifiers:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
            example: hashedPhoneNumber
