openapi: 3.2.0
info:
  version: '2.2'
  title: Dynamic Yield Experience Experience APIs API
  description: API definitions for all Dynamic Yield public endpoints.
  contact:
    name: API Support
    email: apisupport@mastercard.com
    url: https://developer.mastercard.com/support
servers:
- url: https://dy-api.com/v2
  description: US data center
- url: https://direct.dy-api.com/v2
  description: US data center, direct endpoint
- url: https://dy-api.eu/v2
  description: EU data center
- url: https://direct.dy-api.eu/v2
  description: EU data center, direct endpoint
security:
- ApiKeyAuth: []
tags:
- name: Experience APIs
  description: Serve user experience and track user interactions.
paths:
  /collect/user/engagement:
    summary: Track Engagement
    post:
      summary: Track Engagement
      description: 'Report user engagement (clicks) with a variation or a recommended item.

        If you are not sure which server URL you should use, see here.'
      operationId: trackEngagement
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/EngagementBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '204':
          description: Engagements reported successfully.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /collect/user/event:
    summary: Track Events
    post:
      summary: Track Events
      description: 'Report a predefined or custom event.

        If you are not sure which server URL you should use, see here.'
      operationId: trackEvents
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/EventBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '204':
          description: Events reported successfully.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /collect/user/pageview:
    summary: Track Pageviews
    post:
      summary: Track Pageviews
      description: 'Report a pageview without choosing variations for any campaigns.

        This endpoint has the same effect as calling `choose` with an empty `selector` argument.

        If you are not sure which server URL you should use, see here.'
      operationId: trackPageviews
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/PageviewBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '204':
          description: Pageviews reported successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/agent:
    summary: Shopping Muse
    post:
      summary: Shopping Muse
      description: Get response variations for Shopping Muse campaigns.
      operationId: shoppingMuse
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/ShoppingMuseBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessShoppingMuse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/browse:
    summary: Browse
    post:
      summary: Browse
      description: Get variations for category pages.
      operationId: browse
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/BrowseBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessSearch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/choose:
    summary: Choose Variations
    post:
      summary: Choose Variations
      description: 'Get the chosen variations for one or more campaigns.

        If you are not sure which server URL you should use, see here.'
      operationId: chooseVariations
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/ChooseBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessChoose'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/search:
    summary: Search
    post:
      summary: Search
      description: Get search variations for Semantic Search and Visual Search campaigns.
      operationId: search
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessSearch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
  /serve/user/suggest:
    summary: Suggest
    post:
      summary: Suggest
      description: Get autosuggest variations.
      operationId: suggest
      tags:
      - Experience APIs
      requestBody:
        $ref: '#/components/requestBodies/SuggestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessSuggest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidUnprocessable'
components:
  schemas:
    ChooseUserQsr:
      oneOf:
      - $ref: '#/components/schemas/ChooseUserQsrSharedDeviceTrue'
      - $ref: '#/components/schemas/ChooseUserQsrSharedDeviceFalse'
    ReturnAnalyticsMetadata:
      description: Set to `true` to return additional metadata (display names & IDs for all entities) for reporting to analytics tools.
      type: boolean
      default: false
    QueryFilterNumber:
      title: Numeric Filter
      type: object
      properties:
        field:
          description: Column name, as reported in the product feed.
          type: string
          example: price
        min:
          description: Minimum numeric or date value for a product feed attribute, such as `price`.
          type: number
          example: 10
        max:
          description: Maximum numeric or date value for a product feed attribute, such as `price`.
          type: number
          example: 100
      required:
      - field
    DeviceIdQsr:
      description: The identifier of the device in the branch.
      type: string
    Quantity:
      description: Number of items.
      type: number
      example: 1
    InformAffinity:
      title: Inform Affinity
      description: Report an array of product attributes to use in affinity personalization.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/EventName'
        properties:
          allOf:
          - $ref: '#/components/schemas/EventProperties'
          - properties:
              dyType:
                description: Must be `inform-affinity-v1`.
                type: string
                pattern: inform-affinity-v1
              source:
                description: The source of the user data
                type: string
              data:
                description: 'An array of attributes and values.<br><strong>Important:</strong> Reported attributes and values must be an exact match to the product feed<br>Each item in the array includes an attribute and up to 10 values:<br><br>- attribute: "name of attribute"<br>- values: ["value1", "value2"...]'
                type: array
                items:
                  type: object
                  properties:
                    attribute:
                      description: name of attribute
                    values:
                      type: array
                      maxItems: 10
                      items:
                        type: string
            required:
            - dyType
            - data
      example:
        name: Inform Affinity
        properties:
          dyType: inform-affinity-v1
          source: registration-form
          data:
          - attribute: categories
            values:
            - shoes
            - tops
            - accessories
          - attribute: brand
            values:
            - adidas
    DeviceTypeQsr:
      description: Use when the user agent isn't available. Valid values are:<br>`DESKTOP`, `SMARTPHONE`, `TABLET`, `KIOSK`, `ODMB`
      type: string
      enum:
      - DESKTOP
      - SMARTPHONE
      - TABLET
      - KIOSK
      - ODMB
    EventPayloadFi:
      title: Event Request - Financial Institutions
      type: object
      properties:
        user:
          $ref: '#/components/schemas/EngagementUserEcom'
        session:
          $ref: '#/components/schemas/SessionEngagement'
        context:
          $ref: '#/components/schemas/ContextEngagementEcom'
        events:
          $ref: '#/components/schemas/EventsFi'
      required:
      - user
      - session
      - events
    QuerySortBy:
      description: Whether to sort the query results. Leave this field empty to sort results by relevance.
      type: object
      properties:
        field:
          description: Must be a column name from your product feed. Case sensitive. Results will by sorted by column type:<ul><li>**Strings:** alphabetically.</li><li>**Numbers:** by size.</li><li>**Dates:** by recency.</li></ul>To sort by product popularity, use `popularity` instead of a column name.
          type: string
          example: popularity
        order:
          description: The sort order (ascending or descending).
          type: string
          example: asc
          enum:
          - asc
          - desc
      required:
      - field
      - order
    NewsletterSubscription:
      title: Newsletter Subscription
      description: Reports that a user subscribed to a newsletter. Identification event.
      properties:
        name:
          $ref: '#/components/schemas/EventName'
        properties:
          allOf:
          - $ref: '#/components/schemas/EventProperties'
          - properties:
              dyType:
                description: Must be `newsletter-subscription-v1`.
                type: string
                pattern: newsletter-subscription-v1
                default: newsletter-subscription-v1
              cuid:
                $ref: '#/components/schemas/Cuid'
              cuidType:
                $ref: '#/components/schemas/CuidType'
              secondaryIdentifiers:
                allOf:
                - $ref: '#/components/schemas/SecondaryIdentifiers'
                - description: Additional methods for cross-identification. IDs can be any type, but if you use hashed email address (`he`) or hashed phone number (‘hashedPhoneNumber`), it must be SHA-256 hashed. [Learn more about secondary identifiers](https://dy.dev/docs/newsletter-subscription#parameters).
            required:
            - dyType
      example:
        name: Newsletter Subscription
        properties:
          dyType: newsletter-subscription-v1
          cuid: demo@email.com
          cuidType: EcommerceID
          secondaryIdentifiers:
          - type: hashedPhoneNumber
            value: 49c7b1f6d24121078d8f37997b433586fe9a28e2dc4fbd0803eac237ac82255e
          - type: ecommerceID
            value: '12345'
          - type: vipClub
            value: '678910'
    QueryResults:
      title: Query Results
      type: object
      properties:
        choices:
          description: The chosen variation for each campaign.
          type: array
          items:
            oneOf:
            - title: 'type: "SEMANTIC_SEARCH_DECISION"'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  default: Semantic Search
                  pattern: Semantic Search
                type:
                  type: string
                  default: SEMANTIC_SEARCH_DECISION
                  pattern: SEMANTIC_SEARCH_DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: The ID of the returned variation item.
                        type: number
                        example: 27883308
                      payload:
                        type: object
                        properties:
                          type:
                            description: The payload type returned for this variation.
                            type: string
                            default: SEARCH
                            pattern: SEARCH
                            example: SEARCH
                          data:
                            type: object
                            properties:
                              totalNumResults:
                                description: The total number of items that match the query.
                                type: number
                                example: 125
                              facets:
                                description: Facet groups returned for filtering the result set.
                                type: array
                                items:
                                  oneOf:
                                  - title: 'valuesType: "string"'
                                    type: object
                                    properties:
                                      column:
                                        type: string
                                      valuesType:
                                        type: string
                                        enum:
                                        - string
                                      displayName:
                                        type: string
                                      values:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                            count:
                                              type: number
                                  - title: 'valuesType: "number"'
                                    type: object
                                    properties:
                                      column:
                                        type: string
                                      valuesType:
                                        type: string
                                        enum:
                                        - number
                                      displayName:
                                        type: string
                                      min:
                                        type: number
                                      max:
                                        type: number
                              slots:
                                description: The list of product slots returned in the search response.
                                type: array
                                items:
                                  type: object
                                  properties:
                                    slotId:
                                      type: string
                                    sku:
                                      type: string
                              searchQuery:
                                description: The search query as sent in the request
                                type: string
                                example: running shoes
                              normalizedQuery:
                                description: The search query as sent in the request after trimming whitespaces and removing special characters - [%/\\|;:<>]
                                type: string
                                example: running shoes
                              spellCheckedQuery:
                                description: The search query after normalization and typos correction. Only returned for requests with enableSpellCheck = true
                                type: string
                                example: running shoes
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            description: The ID of the campaign that produced the variation.
                            type: number
                            example: 771007
                          campaignName:
                            description: The name of the campaign that produced the variation.
                            type: string
                            example: Semantic Search
                          experienceId:
                            description: The ID of the experience containing the variation.
                            type: number
                            example: 27883307
                          experienceName:
                            description: The name of the experience.
                            type: string
                            example: PLP Experience
                          variationId:
                            description: The ID of the selected variation.
                            type: number
                            example: 27883308
                          variationName:
                            description: The selected variation's name.
                            type: string
                            example: Variation 1
                decisionId:
                  type: string
            - title: 'type: "VISUAL_SEARCH_DECISION"'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  default: Visual Search
                  pattern: Visual Search
                type:
                  type: string
                  default: VISUAL_SEARCH_DECISION
                  pattern: VISUAL_SEARCH_DECISION
                variations:
                  type: array
                  items:
                    $ref: '#/components/schemas/QueryResults/properties/choices/items/oneOf/0/properties/variations/items'
                decisionId:
                  type: string
        cookies:
          description: Cookies returned from the server.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
              maxAge:
                type: string
        warnings:
          description: Errors returned by the server.
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
    EngagementPayloadEcom:
      title: Engagement Request - E-Commerce
      type: object
      properties:
        user:
          $ref: '#/components/schemas/EngagementUserEcom'
        session:
          $ref: '#/components/schemas/SessionEngagement'
        context:
          $ref: '#/components/schemas/ContextEngagementEcom'
        engagements:
          $ref: '#/components/schemas/EngagementsEcom'
      required:
      - user
      - session
      - engagements
    Submission:
      title: Submission
      description: Reports that the user submitted an application.<br>**REQUIRED FOR FINANCIAL INSTITUTIONS SECTIONS**
      type: object
      properties:
        name:
          $ref: '#/components/schemas/EventName'
        properties:
          allOf:
          - $ref: '#/components/schemas/EventProperties'
          - properties:
              dyType:
                description: Must be `purchase-v1`.
                type: string
                pattern: purchase-v1
                default: purchase-v1
              value:
                allOf:
                - $ref: '#/components/schemas/ValueTotal'
                - description: The total monetary value of the event. This refers only to the item or items removed that triggered the event, not the entire cart.<br>Numbers are rounded to the nearest 0.01. Numbers smaller than 0.005 are rounded down to 0.
              currency:
                $ref: '#/components/schemas/Currency'
              uniqueTransactionId:
                $ref: '#/components/schemas/UniqueTransactionId'
              cart:
                allOf:
                - description: The cart's absolute current state. Products are ordered from the first added to the cart to the most recent.
                - $ref: '#/components/schemas/CartEcom'
            required:
            - dyType
            - value
            - cart
      example:
        name: Submission
        properties:
          uniqueTransactionId: 123456
          dyType: purchase-v1
          value: 90.55
          currency: any supported currency code
          cart:
          - productId: item-34454
            quantity: 1
            itemPrice: 65.87
          - productId: sku-4324-bg
            quantity: 2
            itemPrice: 12.34
    DateTime:
      description: 'Date & time in ISO 8601 format: YYYY-MM-DDThh:mm:ss.sss±hh:mm (with local time zone).'
      type: string
      example: '2024-01-01T22:30:00.000-05:00'
    QuerySemanticSearch:
      title: Semantic Search Query
      description: The user query for which to conduct the search.
      type: object
      properties:
        text:
          $ref: '#/components/schemas/QueryText'
        filters:
          $ref: '#/components/schemas/QueryFilters'
        pagination:
          $ref: '#/components/schemas/QueryPagination'
        sortBy:
          $ref: '#/components/schemas/QuerySortBy'
        enableSpellCheck:
          $ref: '#/components/schemas/enableSpellCheck'
      required:
      - text
      - pagination
    PageviewPayloadEcom:
      title: Pageview Request - E-Commerce
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ChooseUserEcom'
        session:
          $ref: '#/components/schemas/Session'
        context:
          $ref: '#/components/schemas/ContextPageviewEcom'
        options:
          $ref: '#/components/schemas/OptionsPageview'
      required:
      - user
      - session
      - context
    QueryPagination:
      description: Pagination parameters for the query result.
      type: object
      properties:
        numItems:
          description: The number of items to be returned in the query result. The maximum is 500 items.
          type: number
          example: 24
        offset:
          description: The starting offset.
          type: number
          example: 0
      required:
      - numItems
      - offset
    Groups:
      description: Call a group of selectors instead of listing each selector individually. Learn more about working with [selector groups](https://dy.dev/docs/selector-groups).
      type: array
      items:
        type: string
    PageviewPayloadFi:
      allOf:
      - title: Pageview Request - Finanacial Institutions
      - $ref: '#/components/schemas/PageviewPayloadEcom'
    enableSpellCheck:
      description: Set to `true`, to enable typo corrections for the textual search query.
      type: boolean
      default: false
    DeviceChooseEcom:
      description: Data for the served device.
      type: object
      properties:
        userAgent:
          $ref: '#/components/schemas/UserAgent'
        type:
          $ref: '#/components/schemas/DeviceTypeEcom'
        browser:
          $ref: '#/components/schemas/Browser'
        ip:
          $ref: '#/components/schemas/Ip'
        dateTime:
          $ref: '#/components/schemas/DateTime'
    Names:
      description: The list of selectors that are eligible for this page. A selector represents a technical name for a campaign. Learn more about [using selectors in your campaigns](https://dy.dev/docs/choose#recommended-use).
      type: array
      items:
        type: string
      example:
      - Banner Main
      - German Banner
      - PDP Recs Tray
    FilterType:
      description: Name of the filter (color, size, brand, fit, author, keyword, category...)<br>Must correspond to a product property in your product feed.
      type: string
      example: color
    Cuid:
      description: User identifier value. Max 250 characters.
      type: string
      enum:
      - demo@email.com
      - '123456789'
    Currency:
      description: The currency used for the value. *Optional, but required for multi-currency sites.*<br>[List of supported currencies](https://support.dynamicyield.com/hc/en-us/articles/360022558254#h_01F248KMJV1VWADRC2H7WYFWCZ)
      type: string
      example: USD
    Signup:
      title: Signup
      type: object
      description: Reports that the user completed the signup process and is a registered user.
      properties:
        name:
          $ref: '#/components/schemas/EventName'
        properties:
          allOf:
          - $ref: '#/components/schemas/EventProperties'
          - properties:
              dyType:
                description: Must be `signup-v1`.
                type: string
              cuid:
                $ref: '#/components/schemas/Cuid'
              cuidType:
                $ref: '#/components/schemas/CuidType'
              secondaryIdentifiers:
                allOf:
                - $ref: '#/components/schemas/SecondaryIdentifiers'
                - description: Additional methods for cross-identification. IDs can be any type, but if you use hashed email address (`he`) or hashed phone number (‘hashedPhoneNumber`), it must be SHA-256 hashed. [Learn more about secondary identifiers](https://dy.dev/docs/signup#parameters).
            required:
            - dyType
      example:
        name: Signup
        properties:
          dyType: signup-v1
          cuid: demo@email.com
          cuidType: EcommerceID
          secondaryIdentifiers:
          - type: hashedPhoneNumber
            value: 49c7b1f6d24121078d8f37997b433586fe9a28e2dc4fbd0803eac237ac82255e
          - type: ecommerceID
            value: '12345'
          - type: vipClub
            value: '678910'
    SkusOnly:
      description: To reduce the size of the response, you can limit it so that it only includes the SKUs.
      type: boolean
    ChooseUserEcom:
      title: User
      description: User ID. A Dynamic Yield-generated identifier is used, and managed via cookies. For a new user, send this object empty.
      type: object
      properties:
        dyid:
          $ref: '#/components/schemas/Dyid'
        dyid_server:
          $ref: '#/components/schemas/Dyid'
        active_consent_accepted:
          $ref: '#/components/schemas/ActiveConsentAccepted'
    RealtimeRules:
      description: A list of realtime filtering rules.
      type: array
      items:
        type: object
        properties:
          type:
            $ref: '#/components/schemas/RealtimeRuleType'
          slots:
            $ref: '#/components/schemas/RealtimeRuleSlots'
          query:
            $ref: '#/components/schemas/RealtimeRuleQuery'
    Page:
      description: Data for the page currently being browsed.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PageType'
        data:
          $ref: '#/components/schemas/PageData'
        location:
          $ref: '#/components/schemas/Location'
        referrer:
          $ref: '#/components/schemas/Referrer'
        locale:
          $ref: '#/components/schemas/Locale'
      required:
      - type
      - location
    MessageOptOut:
      title: Push Opt-Out
      description: Reports that a user opted out of receiving Reconnect push notifications.
      properties:
        name:
          $ref: '#/components/schemas/EventName'
        properties:
          allOf:
          - $ref: '#/components/schemas/EventProperties'
          - properties:
              dyType:
                description: Must be `message-optout-v1`.
                type: string
                pattern: message-optout-v1
                default: message-optout-v1
              pushId:
                $ref: '#/components/schemas/PushId'
            required:
            - dyType
            - pushID
      example:
        name: Push Opt-Out
        properties:
          dyType: message-optout-v1
          pushId: f7a8c987-7ab5-400f-b989-5357af507343
    ContextEventQsr:
      title: Context
      description: The request's context.
      type: object
      properties:
        device:
          $ref: '#/components/schemas/DeviceEventQsr'
        branch:
          $ref: '#/components/schemas/BranchQsrPurchase'
        channel:
          $ref: '#/components/schemas/ChannelQsr'
      required:
      - device
    CartProductIdEcom:
      description: SKU exactly as it appears in the product feed.
      type: string
    SharedDeviceTrue:
      description: Set to `true` for transactions done on a shared device in a branch (always `true` for kiosk and ODMB).
      type: boolean
      default: true
    EngagementEcomPnClick:
      title: 'Engagement (type: PN_CLICK)'
      description: A user engagement with a DY campaign.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EngagementTypeEcomPnClick'
        trackingData:
          $ref: '#/components/schemas/TrackingData'
      required:
      - type
      - trackingData
    DeviceEngagementQsr:
      description: Data for the served device.
      type: object
      properties:
        ip:
          description: 'The client IP address, for geolocation-based targeting and audience building. If not passed, the caller IP is used. This applies only to client-side API calls when isImplicitClientData: true is set in the Options object.'
          type: string
          example: 54.100.200.255
      required:
      - ip
    QueryConditions:
      description: The realtime rule's query conditions.
      type: array
      items:
        type: object
        properties:
          field:
            $ref: '#/components/schemas/QueryField'
          arguments:
            $ref: '#/components/schemas/QueryArguments'
        required:
        - field
        - arguments
    Dy:
      description: Pass the value of the `_dyjsession` cookie if it exists. Otherwise, a new session identifier will be created by Dynamic Yield and returned in the response.
      type: string
    EngagementPayloadQsr:
      title: Engagement Request - Restaurants
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserQsr'
        session:
