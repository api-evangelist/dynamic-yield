        - $ref: '#/components/schemas/NewsletterSubscription'
        - $ref: '#/components/schemas/MessageOptIn'
        - $ref: '#/components/schemas/MessageOptOut'
        - $ref: '#/components/schemas/KeywordSearch'
        - $ref: '#/components/schemas/AddToWishlist'
        - $ref: '#/components/schemas/FilterItems'
        - $ref: '#/components/schemas/ChangeAttribute'
        - $ref: '#/components/schemas/VideoWatch'
        - $ref: '#/components/schemas/SortItems'
        - $ref: '#/components/schemas/PromoCodeEntered'
        - $ref: '#/components/schemas/CustomEvent'
        - $ref: '#/components/schemas/InformAffinity'
    ContextChooseQsr:
      title: Context
