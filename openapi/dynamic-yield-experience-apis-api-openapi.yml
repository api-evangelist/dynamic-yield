            oneOf:
            - title: 'type: DECISION'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: DECISION
                  pattern: DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            default: CUSTOM_JSON
                            pattern: CUSTOM_JSON
                          data:
                            type: object
                      rolloutFlag:
                        type: boolean
                        description: Only in Rollout campaigns
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            type: number
                          campaignName:
                            type: string
                          experienceId:
                            type: number
                          experienceName:
                            type: string
                          variationId:
                            type: number
                          variationName:
                            type: string
                groups:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
                allocationGroup:
                  type: string
            - title: 'type: RECS_DECISION'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: RECS_DECISION
                  pattern: RECS_DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            default: RECS
                            pattern: RECS
                          data:
                            type: object
                            properties:
                              custom:
                                type: object
                              slots:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    sku:
                                      type: string
                                    slotId:
                                      type: string
                                    productData:
                                      type: object
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            type: number
                          campaignName:
                            type: string
                          experienceId:
                            type: number
                          experienceName:
                            type: string
                          variationId:
                            type: number
                          variationName:
                            type: string
                groups:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
                allocationGroup:
                  type: string
            - title: 'type: QSR_PRODUCT_RECS_DECISION'
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: QSR_PRODUCT_RECS_DECISION
                  pattern: QSR_PRODUCT_RECS_DECISION
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      payload:
                        type: object
                        properties:
                          type:
                            type: string
                            default: QSR_PRODUCT_RECS
                            pattern: QSR_PRODUCT_RECS
                          data:
                            type: object
                      analyticsMetadata:
                        type: object
                        properties:
                          campaignId:
                            type: number
                          campaignName:
                            type: string
                          experienceId:
                            type: number
                          experienceName:
                            type: string
                          variationId:
                            type: number
                          variationName:
                            type: string
                groups:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
                allocationGroup:
                  type: string
            - title: 'type: SORTING_DECISION'
              type: object
              properties:
                name:
                  type: string
                id:
                  type: number
                type:
                  type: string
                  default: SORTING_DECISION
                  pattern: SORTING_DECISION
                decisionId:
                  type: string
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      payload:
                        type: object
                        properties:
                          data:
                            type: object
                            properties:
                              slots:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    sku:
                                      type: string
                                    slotId:
                                      type: string
        cookies:
          description: Cookies returned from the server.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
              maxAge:
                type: string
        warnings:
          description: Errors returned by the server.
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
    FilterNumericValue:
