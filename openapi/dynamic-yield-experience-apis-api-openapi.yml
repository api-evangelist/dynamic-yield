            - dyType
            - value
            - productId
            - quantity
      example:
        name: Application Started
        properties:
          dyType: add-to-cart-v1
          value: 400
          currency: EUR
          productId: item-34454
          quantity: 2
          cart:
          - productId: sku-4324-bg
            quantity: 2
            itemPrice: 100
          - productId: item-34454
            quantity: 2
            itemPrice: 200
